[package]
name = "tmdb"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
jiff = { version = "1", features = ["serde"] }
reqwest = { version = "0.13", features = ["gzip", "json"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
url = "2"

[dev-dependencies]
serde_json = "1"
